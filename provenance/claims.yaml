  - piloto_crec_pico_x170_fin
  - piloto_t_GW_90
  - piloto_err_friedmann_max
- id: convergencia-kmax-no-N
  statement: 'En lphi4 VV2 (q = 120) lo que controla el espectro de GWs es el k maximo de la red, no N.
    Con la caja fija (kIR = 0.25), bajar N por debajo de 128 corta la meseta del espectro (que llega a
    k ~ 15-20) y la energia se apila en el borde UV: rho_GW sale x6.0 (N = 32), x2.5 (48), x1.75 (64),
    x1.21 (96). Con N = 64 y kIR = 0.5 (mismo k maximo que N = 128) el espectro de GWs coincide dentro de
    ~9 % rms y rho_GW a 0.3 %, 8.5 veces mas barato; se pierde el IR (chi ~25 % mas bajo en k < 1, sin el
    modo k = 0.25). La resonancia arranca en tau = 88.5 en todos los casos. N = 128, kIR = 0.25 no esta
    convergido en el UV: con kIR = 0.5 (k max 55) el espectro coincide a ~12 % en k 0.5-4 pero la meseta
    k 5-20 baja un factor 1.1-3 y rho_GW un 16 %. Lo robusto es el pico y el IR (k <~ 4).

    '
  evidence:
  - code/convergencia_N.py::main
  - data/convergencia_N/resumen.json
  numbers:
  - conv_N32_rhoGW_rel
  - conv_N48_rhoGW_rel
  - conv_N64_rhoGW_rel
  - conv_N96_rhoGW_rel
  - conv_N64_kIR05_rhoGW_rel
  - conv_N64_kIR05_gw_banda_rms
  - conv_N64_kIR05_minutos
  - conv_tau_res
  - conv_N128_kIR05_rhoGW_rel
  - conv_N128_kIR05_cociente_k05a4
  - conv_N128_kIR05_cociente_k5a20
- id: U1-semilla-transversal
  statement: 'CosmoLattice (RandomWithMatter) arranca el U(1) con A = 0 y solo E longitudinal de Gauss;
    los modos transversales se siembran a segundo orden. Con eso la resonancia gauge llega al 1 % en tau = 105
    contra 68 del control. Agregando vacio transversal (parche u1_vacio_transversal) llega en 68, igual que
    chi. En ambas corridas el campo magnetico crece a la tasa de Floquet q = 120 en k = 0.5-2: la diferencia es
    solo la amplitud de la semilla.

    '
  evidence:
  - CosmoLattice/include/CosmoInterface/initializers/u1initializer.h::initializeRandomWithMatterU1
  - Figueroa et al. 2102.01031, ecs. 97-102
  - code/comparar_modelos.py::main
  - code/crecimiento_por_modo_U1.py::main
  numbers:
  - U1_def_tau_1pc
  - U1_vT_tau_1pc
  - control_N64_kIR05_tau_1pc
  - U1_mu_B_banda
  - U1_vT_masa2
- id: U1-vT-espectro-GW
  statement: 'Con vacio transversal y la misma red (N = 64, kIR = 0.5, una semilla), el espectro de GWs de
    lphi4U1 en la parte convergida (k = 0.5-2.5) es 0.61-0.69 veces el del control; con la condicion de
    CosmoLattice, 0.28-0.42. rho_GW total: +53 % (vacio transversal) y -29 % (CosmoLattice), dominado por
    k > 4 no convergido. Falta variar la semilla.

    '
  evidence:
  - code/comparar_modelos.py::main
  - data/comparacion_modelos.json
  numbers:
  - U1_vT_gw_cociente_k05a25
  - U1_def_gw_cociente_k05a25
  - U1_vT_rhoGW_rel
  - U1_def_rhoGW_rel
