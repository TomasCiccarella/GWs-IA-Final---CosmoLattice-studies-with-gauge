claims:
- id: complejo-guarda-re-im
  statement: 'En CosmoLattice las dos componentes de un escalar complejo son Re(phi) e Im(phi) (no phi_0,
    phi_1 = sqrt(2) Re, sqrt(2) Im), y |phi| = norm(fldCS). Con eso la normalizacion del codigo es consistente
    con el Art I y no hay un factor sqrt(2) perdido en lphi4U1.h.

    '
  evidence:
  - code/verificar_variables_de_programa.py::check (bloque 7, kernel y energia cinetica)
  - CosmoLattice/include/CosmoInterface/definitions/energies.h::kineticCS (norm2(pi)*a^-6, sin 1/2)
  - CosmoLattice/include/CosmoInterface/evolvers/kernels/complexscalarkernels.h::get (-a^(3+alpha)/2 *
    derivCS)
  - Figueroa et al. 2006.15122 (Art I), ecs. 9 y 280
  numbers: []
- id: defaults-no-comparables
  statement: 'Los .in por defecto de lphi4 y lphi4U1 no son una comparacion controlada: lphi4U1 arranca
    con 4 veces la densidad de energia homogenea de lphi4 (su inflaton equivale a un singlete sqrt(2)
    veces mas grande) y con q_A* ~ 1370 contra q = 300. Para aislar el efecto del campo gauge hay que
    dividir cmplx_field_initial_norm y cmplx_momentum_initial_norm por sqrt(2) y elegir gU1s = sqrt(q
    lambda).

    '
  evidence:
  - code/verificar_variables_de_programa.py::comparar_defaults
  - Figueroa et al. 2006.15122 (Art I), ec. 476 y ec. 463
  numbers:
  - qA_lphi4U1_default
  - rho_ratio_U1_over_lphi4_default
  - cmplx_norm_matched
  - cmplx_momentum_matched
  - gU1s_matched_q300
- id: su2u1-defaults-qA-igual-qB
  statement: 'Los defaults de lphi4SU2U1 (gSU2s = 2 gU1s) implementan q_A* = q_B*, la eleccion del Art
    I sec. 8.3, con q ~ 1370.

    '
  evidence:
  - code/verificar_variables_de_programa.py::comparar_defaults
  - Figueroa et al. 2006.15122 (Art I), ec. 476 y sec. 8.3
  numbers:
  - qA_lphi4SU2U1_default
  - qB_lphi4SU2U1_default
- id: gauss-inicial-por-construccion
  statement: 'La condicion inicial de u1initializer.h (pi_i = conj(k_eff_i)/|k_eff|^2 j_0) satisface la
    ley de Gauss discreta exactamente, modo a modo.

    '
  evidence:
  - code/verificar_variables_de_programa.py::check (bloque 6)
  - Figueroa et al. 2006.15122 (Art I), ecs. 298 y 455
  numbers: []
- id: su2-carga-inicial-nula
  statement: La construccion de fluctuaciones de su2initializer.h (amplitudes iguales para ondas izquierda
    y derecha, fases derechas fijadas por las demas, una frecuencia comun omega0) anula exactamente, modo
    a modo, las cuatro cargas iniciales (U(1) y SU(2) a = 1,2,3). Con una frecuencia distinta por componente,
    como escribe la ec. 442, no se anulan.
  evidence:
  - code/verificar_variables_de_programa.py::modo_cero (bloque 8)
  - CosmoLattice/include/CosmoInterface/initializers/su2initializer.h::addFluctuationsSU2DoubletFromPhases
  - Figueroa et al. 2006.15122 (Art I), ecs. 447-453
  numbers: []
- id: su2-gauss-inicial-consistente
  statement: En t = 0 los enlaces SU(2) son la identidad, la ley de Gauss no abeliana (ec. 388) se reduce
    por color a la divergencia hacia atras de U(1), y su2initializer.h la resuelve igual que u1initializer.h.
    El inicializador impone exactamente lo que mide gausslaws.h::checkSU2 despues del fix upstream f6b9c267
    (un dx de mas en el medidor, que reportaba una violacion espuria).
  evidence:
  - code/verificar_variables_de_programa.py::check (bloques 6 y 8)
  - CosmoLattice/include/CosmoInterface/initializers/su2initializer.h::initializeSU2
  - CosmoLattice/include/CosmoInterface/definitions/gausslaws.h::checkSU2
  - upstream cosmolattice commit f6b9c267 (2026-08-03)
  - Figueroa et al. 2006.15122 (Art I), ecs. 388 y 455
  numbers: []
- id: su2u1-emparejado-con-control
  statement: 'lphi4SU2U1 contiene al control lphi4: con SU2Doublet_initial_norm = 5.6964e18/sqrt(2), SU2Doublet_initial_momenta_norm
    = -4.86735e30/sqrt(2) y qG = q, el modulo del doblete y el hijo singlete reproducen el inflaton y
    el hijo chi de lphi4. Los defaults no: arrancan con 2.48 veces la energia del control.'
  evidence:
  - code/verificar_variables_de_programa.py::comparar_defaults
  - Figueroa et al. 2006.15122 (Art I), ecs. 474-476; Manual ec. 90
  numbers:
  - rho_ratio_SU2U1_over_lphi4_default
  - cmplx_norm_matched
  - cmplx_momentum_matched
  - gSU2s_matched_q300
  - qG_matched
  - gU1s_matched_q300
- id: lphi4-in-es-fin-de-inflacion
  statement: Los valores iniciales de lphi4.in v2.0 (5.6964e18 GeV, -4.86735e30 GeV^2) son exactamente
    el estado de lambda*phi^4/4 con lambda = 9e-14 en el momento en que termina la inflacion (eps_H =
    1). Los del Manual v1, iguales al doblete de lphi4SU2U1.in x sqrt(2), son de antes (eps_H = 0.67).
  evidence:
  - code/analisis_parametros.py::fin_inflacion_lphi4
  - CosmoLattice/models/parameter-files/lphi4.in
  - Manual 2102.01031, listado de lphi4.in (lineas 25-26)
  numbers:
  - u_star_fin_inflacion
  - uprime_star_fin_inflacion
  - epsH_manual_v1
- id: lambda-phi4-puro-excluido
  statement: lambda*phi^4 puro normalizado al CMB da lambda ~ 1.4-2.3e-13, pero esta excluido por Planck
    y BICEP/Keck (n_s ~ 0.946, r ~ 0.29). En el completamiento viable que usan el Art I y el Art II (T-model
    con M <= 8.5 m_p) la lambda efectiva del minimo es ~1-3e-12.
  evidence:
  - code/analisis_parametros.py::lphi4_puro
  - code/analisis_parametros.py::t_model
  - 'Art II (2512.15627) sec. 7.2: r < 0.036 => M <~ 8.5 m_p'
  numbers:
  - lambda_lphi4_puro_N50
  - lambda_lphi4_puro_N60
  - ns_lphi4_puro_N55
  - r_lphi4_puro_N55
  - lambda_eff_Tmodel_M8p5_N60
  - lambda_eff_Tmodel_M5_N60
  - Lambda4_validacion_ArtII
- id: q300-resonancia-debil
  statement: q = 300 (lphi4.in por defecto) cae en el borde de una banda y da una resonancia debil y angosta
    (mu = 0.082); q = 120, el caso principal de Dufaux et al. 2007, da mu = 0.175 con el pico en K ~ 1.24.
  evidence:
  - code/analisis_parametros.py::banda_principal
  - Dufaux et al. 0707.0875, ecs. 68-70 y sec. VI B
  numbers:
  - floquet_q300
  - floquet_q120
  - bandas_K0_bordes
- id: su2u1-qA-igual-qB-cambia-banda
  statement: 'Si en SU(2)xU(1) se toma q_A = q_B = q como en el Art I, la resonancia gauge efectiva q_eff
    = q_A + q_B = 2q cae en otra banda (para q = 120: q_eff = 240, crecimiento en K = 0). Para que sea
    comparable con el control hay que tomar q_A = q_B = q/2. Esto depende de la afirmacion del Art I de
    que ambos sectores resuenan juntos con q_eff, que el paper anuncia pero no demuestra.'
  evidence:
  - code/analisis_parametros.py::banda_principal
  - Art I (2006.15122), discusion posterior a la tabla 1
  numbers:
  - floquet_q240
  - floquet_q60
- id: parametros-comparables
  statement: Con lambda = 9e-14, el inflaton en el estado de fin de inflacion, un unico canal resonante
    con q = 120 en cada modelo y la red de lphi4 traducida por sqrt(2) a los modelos gauge, los tres modelos
    arrancan igual y resuenan igual durante la fase lineal; las diferencias en el espectro de GWs deberian
    venir del tipo de campo hijo.
  evidence:
  - code/analisis_parametros.py::recomendacion
  - code/analisis_parametros.py::traducir
  - code/verificar_variables_de_programa.py::comparar_defaults
  numbers:
  - gU1s_rec_U1
  - gU1s_rec_SU2U1
  - gSU2s_rec_SU2U1
  - kIR_gauge_rec
  - tMax_gauge_rec
  - dt_gauge_rec
  - omegaStar_gauge_rec
  - floquet_q120
- id: piloto-lphi4-GWs-siguen-gradientes
  statement: En el piloto las GWs crecen como e^(4 mu tau) durante la resonancia (tasa 0.76 contra 4mu
    = 0.80) y dejan de crecer exponencialmente cuando la energia de gradiente llega al ~1 % (tau ~ 84),
    cerca de la estimacion analitica del fin de la resonancia (tau ~ 77); la mitad de las GWs finales
    esta hecha en tau ~ 130 y el 90 % en tau ~ 203.
  evidence:
  - code/analisis_corridas.py::celdas de la seccion 5
  numbers:
  - piloto_tasa_GW_lineal
  - piloto_t_grad_1pc
  - piloto_t_nl_estimado
  - piloto_t_GW_50
  - piloto_t_GW_90
  - piloto_rhoGW_final
  - piloto_t_res
- id: piloto-lphi4-resonancia-floquet
  statement: En el piloto lphi4 (N=128, q=120) el campo hijo crece segun la teoria de Floquet (ecuacion
    de Lame) al 0.4 % en el maximo, siempre que se use la amplitud conforme real del inflaton, A = 1.138,
    que resulta del transitorio inicial en que a''/a no es despreciable; con amplitud 1 la diferencia
    seria del 14 %.
  evidence:
  - code/analisis_corridas.py::floquet_mu_vec
  - code/analisis_parametros.py::floquet_mu (chequeo cruzado con amplitud 1)
  - Dufaux et al. 2007 (arXiv:0707.0875), ec. 68 y nota 7
  numbers:
  - piloto_mu_medido_banda
  - piloto_A_conforme
  - piloto_mu_floquet_A
- id: piloto-lphi4-valida-dufaux
  statement: 'El piloto reproduce los resultados de Dufaux et al. 2007 para q = 120 en todo lo que depende
    de la resonancia: pico hoy (3.8e-11 contra ~3e-11, frecuencia a 20 % tras escalar lambda^(1/4)), cola
    IR ∝ f, fin de la resonancia en x ~ 90-95 y amplitud del pico en x ~ 150 del mismo orden.'
  evidence:
  - code/analisis_corridas.py::celdas de la seccion 6
  - Dufaux et al. 2007 (arXiv:0707.0875), sec. VI.B, figs. 4, 5 y 6, ecs. 47, 72 y 73
  numbers:
  - piloto_h2Omega_pico_convDufaux
  - piloto_f_pico_convDufaux
  - dufaux_f_pico_reescalado
  - piloto_pendiente_IR
  - piloto_t_grad_1pc
  - piloto_Omega_p_x90
  - piloto_Omega_p_x150
- id: piloto-N128-sin-resolucion-UV
  statement: Con N = 128 y kIR = 0.25 la red llega solo a K ~ 24, cuando el espectro de Dufaux cae en
    K ~ 50; el crecimiento del pico despues de x ~ 170 (22 %), que Dufaux no ve, probablemente es un efecto
    de esa falta de resolucion y se confirma o descarta con N = 256.
  evidence:
  - code/analisis_corridas.py::celdas de la seccion 6
  - Dufaux et al. 2007, fig. 6 y texto (el pico no cambia despues de x ~ 150)
  numbers:
  - piloto_K_max_red
  - piloto_crec_pico_x170_fin
  - piloto_Omega_p_fin
  - piloto_rhoGW_x150_frac
  - memoria_N256_estimada_GB
  - piloto_memoria_MB
  - piloto_runtime_min
- id: integrador-lf-vv2-equivalentes
  statement: Cambiar el integrador de LF a VV2 en el control lphi4 N=128 (misma semilla) no cambia la
    resonancia ni los tiempos (< 0.1 %) y cambia el espectro de GWs entre 0.4 % (energia total) y 5 %
    (pico en x ~ 150), diferencias propias de la fase turbulenta; el error de Friedmann con VV2 crece
    lentamente hasta 7.7e-4.
  evidence:
  - code/analisis_corridas.py::(ejecutado con CORRIDA=lphi4_piloto_N128 y CORRIDA=lphi4_control_N128_VV2)
  - CosmoLattice include/CosmoInterface/evolvers/evolver.h:79 (LF prohibido con U(1) y GWs)
  numbers:
